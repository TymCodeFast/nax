<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page indisponible</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #0c0e13; --fg: #eef1f6; --fg2: #c2c9d4; --muted: #8b93a3; --dim: #626a78;
    --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.14); --field: rgba(255,255,255,.04); --hover: rgba(255,255,255,.07);
    --c1: #7385ff; --c2: #9a86ff; --c3: #f26d7d; --grad: linear-gradient(135deg,#6f81ff,#9a86ff); --mesh-op: .3; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --fg: #12151c; --fg2: #3d4453; --muted: #616a79; --dim: #98a0ae;
    --line: rgba(15,23,42,.09); --line-strong: rgba(15,23,42,.16); --field: rgba(15,23,42,.04); --hover: rgba(15,23,42,.07);
    --c1: #4d55e0; --c2: #7c5cf0; --c3: #e05561; --grad: linear-gradient(135deg,#4d55e0,#7c5cf0); --mesh-op: .16; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  /* fond d'ambiance, comme la zone de contenu de NaX */
  .mesh { position: fixed; inset: -20%; opacity: var(--mesh-op); filter: blur(90px); pointer-events: none;
    background:
      radial-gradient(38% 48% at 16% 18%, rgba(115,133,255,.22), transparent 72%),
      radial-gradient(36% 46% at 86% 26%, rgba(154,134,255,.16), transparent 72%),
      radial-gradient(50% 60% at 62% 104%, rgba(115,133,255,.10), transparent 72%); }
  #stage { position: relative; height: 100%; display: grid; place-items: center; }
  .card { width: min(480px, 90%); text-align: center; padding: 8px; animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* halo teinté plutôt que pavé saturé */
  .halo { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c1) 11%, transparent); color: var(--c1); }
  .halo svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  h1 { font-size: 21px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  .explain { color: var(--muted); margin: 0 auto; max-width: 400px; font-size: 13.5px; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 6px; }

  .url { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; margin: 18px auto 22px; padding: 7px 12px;
    background: var(--field); border: 1px solid var(--line); border-radius: 999px; }
  .url svg { width: 13px; height: 13px; flex: none; fill: none; stroke: var(--dim); stroke-width: 1.8; stroke-linecap: round; }
  .url span { color: var(--fg2); font: 400 12px "JetBrains Mono", ui-monospace, monospace; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; user-select: text; }

  .actions { display: flex; gap: 10px; justify-content: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 11px; border: 1px solid var(--line-strong);
    background: transparent; color: var(--fg); font: 600 13.5px Inter; text-decoration: none; cursor: pointer; transition: transform .15s, background .15s, filter .15s; }
  .btn:hover { background: var(--hover); transform: translateY(-1px); }
  .btn.primary { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(91,107,245,.3); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--grad); }
  .btn.hidden { display: none; }

  /* nouvelle tentative automatique (serveur local) */
  #auto { display: none; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; color: var(--dim); font-size: 12.5px; }
  #auto.on { display: flex; }
  #auto .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--c1); animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(115,133,255,.4); } 60% { box-shadow: 0 0 0 6px rgba(115,133,255,0); } }

  .code { margin-top: 26px; }
  .code span { color: var(--dim); font: 500 10.5px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .04em;
    background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; user-select: text; }
</style>
</head>
<body>
<div class="mesh"></div>
<div id="stage">
  <div class="card">
    <div class="halo" id="halo"></div>
    <h1 id="title">Cette page est inaccessible</h1>
    <p class="explain" id="msg">Impossible de charger le site.</p>
    <p class="hint" id="hint"></p>
    <div class="url"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></svg><span id="url"></span></div>
    <div class="actions">
      <a class="btn primary" id="retry">Réessayer</a>
      <a class="btn hidden" id="search">Rechercher sur Google</a>
    </div>
    <div id="auto"><span class="pulse"></span><span id="auto-label">Nouvelle tentative automatique…</span></div>
    <div class="code"><span id="code"></span></div>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const url = p.get('url') || '';
  const code = p.get('code') || '';
  const desc = p.get('desc') || '';
  const $ = (id) => document.getElementById(id);

  let host = ''; try { host = new URL(url).hostname; } catch {}
  const isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(host);

  // icône, titre et explication selon l'erreur — pas un message générique pour tout
  const ICONS = {
    offline: '<path d="M3 3l18 18"/><path d="M8.5 8.5a5 5 0 0 0 .5 9H18a4 4 0 0 0 1.4-7.8"/>',
    dns: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/><path d="M11 8v3.2l2 1.6"/>',
    refused: '<path d="M12 3v8"/><path d="M6.3 6.5a8 8 0 1 0 11.4 0"/>',
    slow: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>',
    cert: '<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M12 8v4M12 15.5v.5"/>',
    generic: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16.5v.5"/>',
  };
  const KINDS = {
    '-106': { icon: 'offline', title: 'Pas de connexion Internet', msg: 'Ton appareil semble hors ligne. Vérifie le Wi-Fi ou le câble réseau.' },
    '-105': { icon: 'dns', title: 'Adresse introuvable', msg: 'Ce nom de domaine n’existe pas ou ne répond pas.', hint: 'Une faute de frappe dans l’adresse ?' , search: true },
    '-102': { icon: 'refused', title: 'Connexion refusée', msg: 'Le serveur a répondu, mais il refuse la connexion sur ce port.' },
    '-118': { icon: 'slow', title: 'Le site met trop de temps', msg: 'Pas de réponse dans les délais. Le site est peut-être surchargé.' },
    '-7':   { icon: 'slow', title: 'Le site met trop de temps', msg: 'Pas de réponse dans les délais. Le site est peut-être surchargé.' },
    '-201': { icon: 'cert', title: 'Connexion non sûre', msg: 'Le certificat de sécurité du site pose problème. NaX a bloqué la page.' },
  };
  const k = KINDS[code] || { icon: 'generic', title: 'Cette page est inaccessible', msg: 'Impossible de charger le site.' };

  $('halo').innerHTML = '<svg viewBox="0 0 24 24">' + ICONS[k.icon] + '</svg>';
  $('title').textContent = k.title;
  $('msg').textContent = k.msg;
  $('url').textContent = url;
  $('code').textContent = desc || ('ERR ' + code);
  $('retry').href = url || 'https://www.google.com';

  // serveur local qui ne répond pas : cas typique du dev — on le dit, et on guette son retour
  if (isLocal && (code === '-102' || code === '-118' || code === '-7')) {
    $('hint').textContent = 'Serveur local : il n’est sans doute pas lancé, ou il n’écoute pas sur ce port.';
  } else if (k.hint) {
    $('hint').textContent = k.hint;
  }
  if (k.search && host) {
    const s = $('search');
    s.classList.remove('hidden');
    s.href = 'https://www.google.com/search?q=' + encodeURIComponent(host);
  }

  // Nouvelle tentative automatique pour les serveurs locaux : la page revient toute seule
  // dès que le serveur répond (npm run dev relancé, par exemple).
  if (isLocal && url && (code === '-102' || code === '-118' || code === '-7')) {
    $('auto').classList.add('on');
    let tries = 0;
    const probe = async () => {
      tries++;
      $('auto-label').textContent = 'Nouvelle tentative automatique… (' + tries + ')';
      try { await fetch(url, { mode: 'no-cors', cache: 'no-store' }); location.replace(url); return; } catch {}
      setTimeout(probe, 3000);
    };
    setTimeout(probe, 3000);
  }
</script>
</body>
</html>
