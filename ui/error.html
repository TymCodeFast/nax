<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page indisponible</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #0c0e13; --panel: #171a21; --fg: #eef1f6; --muted: #8b93a3; --dim: #626a78;
    --line: rgba(255,255,255,.09); --c1: #7385ff; --c2: #9a86ff; --grad: linear-gradient(135deg,#6f81ff,#9a86ff); }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --panel: #ffffff; --fg: #12151c; --muted: #616a79; --dim: #98a0ae;
    --line: rgba(15,23,42,.09); --c1: #4d55e0; --c2: #7c5cf0; --grad: linear-gradient(135deg,#4d55e0,#7c5cf0); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: grid; place-items: center; }
  .card { width: min(440px, 88%); text-align: center; padding: 8px; }
  .glyph { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 20px; display: grid; place-items: center;
    background: var(--grad); color: #fff; box-shadow: 0 8px 24px rgba(91,107,245,.32); }
  .glyph svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  p { color: var(--muted); margin: 0 0 6px; }
  .url { color: var(--dim); font: 400 12.5px "JetBrains Mono", ui-monospace, monospace; word-break: break-all; margin: 4px 0 24px; }
  .code { color: var(--dim); font-size: 12px; margin-top: 18px; }
  .actions { display: flex; gap: 10px; justify-content: center; }
  a.btn, button.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 11px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); font: 600 14px Inter; text-decoration: none; cursor: pointer; }
  a.btn.primary { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(91,107,245,.3); }
  a.btn:hover { transform: translateY(-1px); } a.btn { transition: transform .15s; }
</style>
</head>
<body>
<div class="card">
  <div class="glyph"><svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M8.5 8.5a5 5 0 0 0 .5 9H18a4 4 0 0 0 1.4-7.8"/></svg></div>
  <h1>Cette page est inaccessible</h1>
  <p id="msg">Impossible de charger le site.</p>
  <div class="url" id="url"></div>
  <div class="actions">
    <a class="btn primary" id="retry">Réessayer</a>
  </div>
  <div class="code" id="code"></div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const url = p.get('url') || '';
  const code = p.get('code') || '';
  const desc = p.get('desc') || '';
  document.getElementById('url').textContent = url;
  const retry = document.getElementById('retry');
  retry.href = url || 'https://www.google.com';
  const msgs = {
    '-106': 'Aucune connexion Internet détectée.',
    '-105': 'Adresse introuvable (nom de domaine invalide).',
    '-102': 'Connexion refusée par le serveur.',
    '-118': 'Le site a mis trop de temps à répondre.',
    '-201': 'Le certificat de sécurité du site pose problème.',
    '-7': 'Le site a mis trop de temps à répondre.',
  };
  document.getElementById('msg').textContent = msgs[code] || 'Impossible de charger le site.';
  document.getElementById('code').textContent = (desc ? desc : ('Erreur ' + code));
</script>
</body>
</html>
