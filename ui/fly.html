<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Mini-panneau flottant du rail : mêmes codes que l'aperçu Gmail (fenêtre transparente, coins, ombre). */
  :root {
    --panel: rgba(21, 24, 31, .97); --fg: #eef1f6; --fg2: #c2c9d4; --muted: #8b93a3; --dim: #626a78;
    --line: rgba(255,255,255,.07); --line-strong: rgba(255,255,255,.13); --hover: rgba(255,255,255,.06);
    --c1: #7385ff; --c2: #9a86ff; --shadow: 6px 10px 24px -10px rgba(0,0,0,.65), 0 1px 2px rgba(0,0,0,.3);
  }
  @media (prefers-color-scheme: light) {
    :root { --panel: rgba(255,255,255,.98); --fg: #12151c; --fg2: #3d4453; --muted: #616a79; --dim: #98a0ae;
      --line: rgba(15,23,42,.08); --line-strong: rgba(15,23,42,.15); --hover: rgba(15,23,42,.06);
      --c1: #4d55e0; --c2: #7c5cf0; --shadow: 6px 10px 24px -10px rgba(15,23,42,.38), 0 1px 2px rgba(15,23,42,.12); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--fg);
    font: 12.5px/1.35 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  #wrap { display: flex; flex-direction: column; max-height: calc(100% - 36px); margin: 8px 24px 28px 8px; /* marges = place de l'ombre dans la fenêtre transparente (voir main.js) */
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
    opacity: 0; transform: translateY(4px) scale(.98); }
  #wrap.pop { animation: pop 140ms cubic-bezier(.2,.8,.2,1) forwards; }
  #wrap.closing { animation: pop 110ms cubic-bezier(.2,.8,.2,1) reverse forwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  /* en-tête : logo + nom de l'appli, et le crayon « Personnaliser » à droite */
  #head { flex: none; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); }
  #hico { width: 20px; height: 20px; flex: none; border-radius: 5px; display: grid; place-items: center; color: var(--c1); }
  #hico svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #htitle { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hedit { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); cursor: pointer; display: none; place-items: center; transition: background .15s, color .15s; }
  #hedit.on { display: grid; }
  #hedit:hover { background: var(--hover); color: var(--fg); }
  #hedit svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* lignes : icône, nom, hôte en dessous */
  #items { min-height: 0; overflow-y: auto; padding: 5px; }
  ::-webkit-scrollbar { width: 7px; } ::-webkit-scrollbar-thumb { background: rgba(128,128,128,.3); border-radius: 7px; }
  .it { display: flex; align-items: center; gap: 11px; padding: 7px 10px 7px 9px; border-radius: 10px; cursor: pointer; transition: background .12s; }
  .it:hover { background: var(--hover); }
  .it .ico { width: 22px; height: 22px; flex: none; display: grid; place-items: center; }
  .it .ico img { width: 20px; height: 20px; border-radius: 5px; }
  .it .ico .dot { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; }
  .it .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .it .nm { font-size: 12.5px; font-weight: 500; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .host { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .go { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--dim); opacity: 0; transform: translateX(-3px); transition: opacity .15s, transform .15s; }
  .it:hover .go { opacity: 1; transform: none; }
  /* croix « retirer ce raccourci » (raccourcis d'appli) : remplace le chevron au survol de la ligne */
  .it .rm { flex: none; display: none; width: 24px; height: 24px; border: 0; border-radius: 7px; background: transparent; color: var(--dim); cursor: pointer; place-items: center; }
  .it .rm svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .it .rm:hover { background: rgba(242,109,125,.16); color: #f26d7d; }
  .it.has-rm:hover .rm { display: grid; }
  .it.has-rm:hover .go { display: none; }

  /* dossiers : ligne simple, chevron qui pivote, sous-éléments en retrait avec un filet de guidage */
  .it.folder { padding: 8px 8px 8px 7px; gap: 8px; }
  .it .chev { flex: none; width: 14px; height: 14px; fill: none; stroke: var(--dim); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .18s; }
  .fold.open > .it.folder .chev { transform: rotate(90deg); }
  .it .fico { flex: none; width: 20px; height: 20px; display: grid; place-items: center; color: var(--c1); }
  .it .fico svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .it.folder .nm { font-weight: 600; }
  .it .cnt { flex: none; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .it .all { flex: none; display: none; width: 24px; height: 24px; border: 0; border-radius: 7px; background: transparent; color: var(--dim); cursor: pointer; place-items: center; }
  .it .all svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .it .all:hover { background: var(--hover); color: var(--c1); }
  .it.folder:hover .all { display: grid; }
  .it.folder:hover .cnt { display: none; }
  .kids { display: none; margin-left: 17px; padding-left: 6px; border-left: 1px solid var(--line); }
  .fold.open > .kids { display: block; }
  .empty { padding: 12px 14px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="head">
    <span id="hico"></span>
    <span id="htitle"></span>
    <button id="hedit" title="Personnaliser les raccourcis"><svg viewBox="0 0 24 24"><path d="M14.5 5.5l4 4M4 20l4.5-1 9-9-4-4-9 9z"/></svg></button>
  </div>
  <div id="items"></div>
</div>
<script>
  const esc = (s) => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const AV = ['#7385ff','#9a86ff','#5aa0f2','#38bda8','#e0a53a','#e07a8b','#7c8cff','#5fbf88'];
  const col = (s) => AV[[...(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length];
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const favicon = (u) => { const h = hostOf(u); return h ? 'https://www.google.com/s2/favicons?domain=' + h + '&sz=64' : ''; };
  // icône d'une ligne ; repli sur une pastille à la lettre si l'image ne charge pas
  const iconHtml = (src, name) => {
    const c = col(name), l = esc((name[0] || '?').toUpperCase());
    const dot = `<span class="dot" style="background:${c}24;color:${c}">${l}</span>`;
    return src ? `<img src="${esc(src)}" onerror="this.outerHTML=this.dataset.fb" data-fb="${esc(dot)}">` : dot;
  };

  const FOLDER_SVG = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const OPEN_ALL_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const open = new Set();   // dossiers dépliés (réinitialisé à chaque nouvelle charge)
  let cur = null;
  const wrapEl = document.getElementById('wrap');
  let armed = false, closing = false;

  // hauteur exacte demandée à la fenêtre : en-tête + contenu + marges d'ombre
  function resize() {
    const head = document.getElementById('head'), items = document.getElementById('items');
    fly.resize(head.offsetHeight + items.scrollHeight + 2 + 36);
  }
  function rowHtml(it, d) {
    if (it.type === 'folder') {
      const tint = it.color ? 'style="color:' + esc(it.color) + '"' : '';
      return '<div class="fold' + (open.has(it.id) ? ' open' : '') + '" data-id="' + esc(it.id) + '">' +
        '<div class="it folder" data-id="' + esc(it.id) + '">' +
          '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>' +
          '<span class="fico" ' + tint + '>' + FOLDER_SVG + '</span>' +
          '<span class="txt"><span class="nm">' + esc(it.name) + '</span></span>' +
          '<span class="cnt">' + it.count + '</span>' +
          '<button class="all" title="Ouvrir tous les liens" data-all="' + esc(it.id) + '">' + OPEN_ALL_SVG + '</button>' +
        '</div>' +
        '<div class="kids">' + (it.children.length ? it.children.map((c) => rowHtml(c, d)).join('') : '<div class="empty">Dossier vide</div>') + '</div>' +
      '</div>';
    }
    // une appli : ses raccourcis reprennent son logo ; un dossier : le favicon de chaque lien
    const src = d.kind === 'app' ? (d.icon || favicon(it.url)) : (it.favicon || favicon(it.url));
    const rm = d.kind === 'app' ? '<button class="rm" title="Retirer ce raccourci" data-rm="' + esc(it.id) + '"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' : '';
    return '<div class="it' + (rm ? ' has-rm' : '') + '" data-id="' + esc(it.id) + '">' +
      '<span class="ico">' + iconHtml(src, it.name) + '</span>' +
      '<span class="txt"><span class="nm">' + esc(it.name) + '</span><span class="host">' + esc(hostOf(it.url)) + '</span></span>' +
      '<svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>' + rm +
    '</div>';
  }
  function render(d) {
    document.getElementById('htitle').textContent = d.title || '';
    const hico = document.getElementById('hico');
    hico.innerHTML = d.icon
      ? '<img src="' + esc(d.icon) + '" width="20" height="20" style="border-radius:5px" onerror="this.remove()">'
      : FOLDER_SVG;
    const edit = document.getElementById('hedit');
    edit.classList.toggle('on', !!d.edit);
    edit.onclick = () => fly.edit(d.id);
    const box = document.getElementById('items');
    box.innerHTML = d.items.length ? d.items.map((it) => rowHtml(it, d)).join('') : '<div class="empty">Ce dossier est vide.</div>';
    // dossier : un clic le plie / le déplie sur place ; le bouton → ouvre tous ses liens
    box.querySelectorAll('.it.folder').forEach((el) => {
      el.onclick = () => {
        const f = el.parentElement, id = f.dataset.id;
        if (open.has(id)) open.delete(id); else open.add(id);
        f.classList.toggle('open', open.has(id));
        resize();
      };
    });
    box.querySelectorAll('.all').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); fly.openAll(b.dataset.all); }; });
    box.querySelectorAll('.rm').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); fly.removeItem({ id: d.id, itemId: b.dataset.rm }); }; });
    // lien : clic = ouvrir ; Ctrl+clic ou clic molette = nouvel onglet (jamais pour les raccourcis d'appli)
    box.querySelectorAll('.it:not(.folder)').forEach((el) => {
      const go = (newTab) => fly.click({ kind: d.kind, id: d.id, itemId: el.dataset.id, newTab: !!newTab });
      el.onclick = (e) => go(e.ctrlKey || e.metaKey);
      el.onauxclick = (e) => { if (e.button === 1) go(true); };
    });
    cur = d;
    resize();
  }
  fly.onLoad((d) => {
    open.clear(); render(d);
    closing = false; wrapEl.classList.remove('closing'); // annule une sortie en cours si on rouvre avant la fin
    if (d.fresh) { // nouvelle apparition (fenêtre masquée jusqu'ici) : rejoue l'entrée
      wrapEl.classList.remove('pop');
      void wrapEl.offsetWidth;
      armed = true;
      fly.ready();
    }
  });
  fly.onPlay(() => { if (!armed) return; armed = false; requestAnimationFrame(() => wrapEl.classList.add('pop')); });
  fly.onClose(() => { if (closing) return; closing = true; wrapEl.classList.add('closing'); });

  document.addEventListener('mouseenter', () => fly.hover(true), true);
  document.body.addEventListener('mouseleave', () => fly.hover(false));
  window.addEventListener('mouseover', () => fly.hover(true));
</script>
</body>
</html>
