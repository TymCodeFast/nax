<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Mini-panneau flottant du rail : mêmes codes que l'aperçu Gmail (fenêtre transparente, coins, ombre). */
  :root {
    --panel: rgba(21, 24, 31, .97); --fg: #eef1f6; --fg2: #c2c9d4; --muted: #8b93a3; --dim: #626a78;
    --line: rgba(255,255,255,.07); --line-strong: rgba(255,255,255,.13); --hover: rgba(255,255,255,.06);
    --c1: #7385ff; --shadow: 0 18px 48px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: light) {
    :root { --panel: rgba(255,255,255,.98); --fg: #12151c; --fg2: #3d4453; --muted: #616a79; --dim: #98a0ae;
      --line: rgba(15,23,42,.08); --line-strong: rgba(15,23,42,.15); --hover: rgba(15,23,42,.06);
      --c1: #4d55e0; --shadow: 0 18px 48px rgba(15,23,42,.22); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--fg);
    font: 12.5px/1.4 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  #wrap { display: flex; flex-direction: column; max-height: calc(100% - 24px); margin: 12px;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 13px; box-shadow: var(--shadow); overflow: hidden; }
  #title { flex: none; padding: 10px 13px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #items { overflow-y: auto; padding: 0 5px 5px; }
  ::-webkit-scrollbar { width: 7px; } ::-webkit-scrollbar-thumb { background: rgba(128,128,128,.3); border-radius: 7px; }
  .it { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; cursor: pointer; transition: background .12s; }
  .it:hover { background: var(--hover); }
  .it img { width: 15px; height: 15px; border-radius: 4px; flex: none; }
  .it .dot { width: 15px; height: 15px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 9px; font-weight: 700; }
  .it span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg2); }
  .it:hover span { color: var(--fg); }
  .it.foot { border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; margin-top: 4px; color: var(--dim); }
  .it.foot svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; flex: none; color: var(--dim); }
  .it.foot span { color: var(--dim); font-size: 12px; }
  .it.foot:hover span { color: var(--fg2); }
</style>
</head>
<body>
<div id="wrap">
  <div id="title"></div>
  <div id="items"></div>
</div>
<script>
  const esc = (s) => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const AV = ['#7385ff','#9a86ff','#5aa0f2','#38bda8','#e0a53a','#e07a8b','#7c8cff','#5fbf88'];
  const col = (s) => AV[[...(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length];
  const favicon = (u) => { try { return 'https://www.google.com/s2/favicons?domain=' + new URL(u).hostname + '&sz=64'; } catch { return ''; } };

  fly.onLoad((d) => {
    document.getElementById('title').textContent = d.title || '';
    const box = document.getElementById('items');
    box.innerHTML = d.items.map((it) => {
      const src = it.favicon || favicon(it.url);
      const c = col(it.name);
      const ico = src
        ? `<img src="${esc(src)}" onerror="this.outerHTML='<span class=dot style=background:${c}24;color:${c}>${esc((it.name[0]||'?').toUpperCase())}</span>'">`
        : `<span class="dot" style="background:${c}24;color:${c}">${esc((it.name[0]||'?').toUpperCase())}</span>`;
      return `<div class="it" data-id="${esc(it.id)}">${ico}<span>${esc(it.name)}</span></div>`;
    }).join('') + (d.footer ? `<div class="it foot" id="foot"><svg viewBox="0 0 24 24"><path d="M14.5 5.5l4 4M4 20l4.5-1 9-9-4-4-9 9z"/></svg><span>${esc(d.footer)}</span></div>` : '');
    box.querySelectorAll('.it[data-id]').forEach((el) => { el.onclick = () => fly.click({ kind: d.kind, id: d.id, itemId: el.dataset.id }); });
    const foot = document.getElementById('foot'); if (foot) foot.onclick = () => fly.edit(d.id);
  });

  document.addEventListener('mouseenter', () => fly.hover(true), true);
  document.body.addEventListener('mouseleave', () => fly.hover(false));
  window.addEventListener('mouseover', () => fly.hover(true));
</script>
</body>
</html>
