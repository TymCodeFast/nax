<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #0f1218; --head: #0a0b0e; --fg: #eef1f6; --fg2: #c2c9d4; --muted: #8b93a3; --dim: #626a78;
    --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.05); --active: rgba(255,255,255,.085);
    --c1: #7385ff; --c2: #9a86ff; --grad: linear-gradient(135deg,#6f81ff,#9a86ff);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #ffffff; --head: #f1f3f7; --fg: #12151c; --fg2: #3d4453; --muted: #616a79; --dim: #98a0ae;
      --line: rgba(15,23,42,.09); --hover: rgba(15,23,42,.05); --active: rgba(15,23,42,.08);
      --c1: #4d55e0; --c2: #7c5cf0; --grad: linear-gradient(135deg,#4d55e0,#7c5cf0); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 13px Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #head { position: relative; height: 44px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 6px 0 14px;
    background: var(--head); border-bottom: 1px solid var(--line); }
  #head::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--grad); }
  #ico { width: 17px; height: 17px; border-radius: 4px; flex: none; }
  #name { font-weight: 600; }
  #count { font: 600 11px Inter; color: #fff; background: var(--grad); border-radius: 999px; padding: 1px 8px; margin-left: 2px; }
  #count.hidden { display: none; }
  #spacer { flex: 1; }
  .hbtn { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .hbtn:hover { background: var(--hover); color: var(--fg); }
  .hbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .hbtn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #widget { flex: 1; overflow-y: auto; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border-radius: 8px; }
  .mail { display: flex; gap: 11px; padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--line); transition: background .12s; }
  .mail:hover { background: var(--hover); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
  .mbody { flex: 1; min-width: 0; }
  .mtop { display: flex; align-items: baseline; gap: 8px; }
  .from { font-weight: 600; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .time { color: var(--dim); font-size: 11px; white-space: nowrap; flex: none; }
  .subj { color: var(--fg2); font-size: 12.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 1px; }
  .snip { color: var(--dim); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 1px; }
  .state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; color: var(--muted); text-align: center; padding: 30px; }
  .state svg { width: 42px; height: 42px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--c2); }
  .state .big { font-weight: 600; color: var(--fg); }
  .state button { margin-top: 4px; padding: 9px 16px; border: 0; border-radius: 10px; background: var(--grad); color: #fff; font-weight: 600; cursor: pointer; }
  .loader { width: 26px; height: 26px; border: 2.5px solid var(--line); border-top-color: var(--c1); border-radius: 50%; animation: spin .8s linear infinite; }
  #foot { flex: none; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; text-align: center; cursor: pointer; }
  #foot:hover { color: var(--fg); background: var(--hover); }
  #foot.hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="head">
    <img id="ico" alt="">
    <span id="name">Aperçu</span>
    <span id="count" class="hidden"></span>
    <span id="spacer"></span>
    <button id="refresh" class="hbtn" title="Rafraîchir"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    <button id="open" class="hbtn" title="Ouvrir en grand"><svg viewBox="0 0 24 24"><path d="M9 5H5v4M5 5l6 6M15 19h4v-4M19 19l-6-6"/></svg></button>
  </div>
  <div id="widget"></div>
  <div id="foot">Ouvrir Gmail</div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const widget = $('widget'), nameEl = $('name'), icoEl = $('ico'), countEl = $('count'), refreshBtn = $('refresh');

  const AV = ['#6f81ff','#9a86ff','#5aa0f2','#38bda8','#e0a53a','#e07a8b','#7c8cff','#5fbf88'];
  const avatarColor = (s) => AV[[...(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length];
  function relTime(iso) {
    const t = Date.parse(iso); if (isNaN(t)) return '';
    const m = Math.round((Date.now()-t)/60000);
    if (m < 1) return "à l'instant"; if (m < 60) return m+' min';
    const h = Math.round(m/60); if (h < 24) return h+' h';
    const d = Math.round(h/24); return d===1?'hier':d+' j';
  }
  const esc = (s) => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  peek.onLoad((d) => {
    nameEl.textContent = d.name || 'Gmail';
    if (d.icon) { icoEl.src = d.icon; icoEl.style.display = ''; } else icoEl.style.display = 'none';
    loadGmail();
  });

  async function loadGmail() {
    refreshBtn.classList.add('spin');
    widget.innerHTML = '<div class="state"><div class="loader"></div></div>';
    let r; try { r = await peek.gmailFeed(); } catch { r = { error: true }; }
    refreshBtn.classList.remove('spin');
    if (!r || r.error) { widget.innerHTML = state('cloud-off', 'Impossible de récupérer les mails', 'Réessaie dans un moment.'); countEl.classList.add('hidden'); return; }
    if (!r.authed) {
      widget.innerHTML = state('lock', 'Connecte-toi à Gmail', 'Ouvre Gmail une fois pour activer l’aperçu.', 'Ouvrir Gmail');
      countEl.classList.add('hidden');
      const b = widget.querySelector('button'); if (b) b.onclick = () => peek.openFull();
      return;
    }
    if (r.count) { countEl.textContent = r.count; countEl.classList.remove('hidden'); } else countEl.classList.add('hidden');
    if (!r.messages.length) { widget.innerHTML = state('check', 'Aucun nouveau mail', 'Boîte de réception à jour.'); return; }
    widget.innerHTML = r.messages.map((m) => `
      <div class="mail" data-link="${esc(m.link)}">
        <div class="avatar" style="background:${avatarColor(m.from)}">${esc((m.from.trim()[0]||'?').toUpperCase())}</div>
        <div class="mbody">
          <div class="mtop"><span class="from">${esc(m.from)}</span><span class="time">${relTime(m.date)}</span></div>
          <div class="subj">${esc(m.subject)}</div>
          <div class="snip">${esc(m.summary)}</div>
        </div>
      </div>`).join('');
    widget.querySelectorAll('.mail').forEach((el) => { el.onclick = () => peek.openMail(el.dataset.link); });
  }
  function state(icon, big, sub, btn) {
    const icons = {
      check: '<path d="M20 6L9 17l-5-5"/>',
      lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
      'cloud-off': '<path d="M3 3l18 18"/><path d="M8 8a5 5 0 0 0 .5 9H18a4 4 0 0 0 1.5-7.7"/>',
    };
    return `<div class="state"><svg viewBox="0 0 24 24">${icons[icon]||icons.check}</svg><div class="big">${big}</div><div>${sub||''}</div>${btn?`<button>${btn}</button>`:''}</div>`;
  }

  $('open').onclick = () => peek.openFull();
  refreshBtn.onclick = () => loadGmail();
  $('foot').onclick = () => peek.openFull();
  document.addEventListener('mouseenter', () => peek.hover(true), true);
  document.body.addEventListener('mouseleave', () => peek.hover(false));
  window.addEventListener('mouseover', () => peek.hover(true));
</script>
</body>
</html>
