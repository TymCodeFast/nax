<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Fenêtre transparente : on dessine un panneau arrondi + ombre, comme les panneaux de NaX. */
  :root {
    --panel: rgba(21, 24, 31, .97); --fg: #eef1f6; --fg2: #c2c9d4; --muted: #8b93a3; --dim: #626a78;
    --line: rgba(255,255,255,.07); --line-strong: rgba(255,255,255,.13);
    --field: rgba(255,255,255,.04); --hover: rgba(255,255,255,.05);
    --c1: #7385ff; --c2: #9a86ff; --grad: linear-gradient(135deg,#6f81ff,#9a86ff);
    --shadow: 0 24px 64px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.04) inset;
  }
  @media (prefers-color-scheme: light) {
    :root { --panel: rgba(255,255,255,.98); --fg: #12151c; --fg2: #3d4453; --muted: #616a79; --dim: #98a0ae;
      --line: rgba(15,23,42,.08); --line-strong: rgba(15,23,42,.15);
      --field: rgba(15,23,42,.04); --hover: rgba(15,23,42,.05);
      --c1: #4d55e0; --c2: #7c5cf0; --grad: linear-gradient(135deg,#4d55e0,#7c5cf0);
      --shadow: 0 24px 64px rgba(15,23,42,.25); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--fg);
    font: 13px/1.4 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  #wrap { display: flex; flex-direction: column; height: calc(100% - 24px); margin: 12px;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden; }

  /* en-tête : icône + nom + pastille non-lus, actions discrètes */
  #head { height: 48px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); }
  #ico { width: 18px; height: 18px; border-radius: 5px; flex: none; }
  #name { font-size: 13.5px; font-weight: 600; }
  #count { font: 600 10.5px Inter; color: #fff; background: var(--grad); border-radius: 999px; padding: 2px 8px; }
  #count.hidden { display: none; }
  #spacer { flex: 1; }
  .hbtn { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s; }
  .hbtn:hover { background: var(--hover); color: var(--fg); }
  .hbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .hbtn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* liste : cartes arrondies, sans filets durs */
  #widget { flex: 1; overflow-y: auto; padding: 6px 8px; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(128,128,128,.3); border-radius: 8px; }
  .mail { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 11px; cursor: pointer; transition: background .12s; }
  .mail:hover { background: var(--hover); }
  .avatar { width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .mbody { flex: 1; min-width: 0; }
  .mtop { display: flex; align-items: baseline; gap: 8px; }
  .from { font-weight: 600; font-size: 12.5px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .time { color: var(--dim); font-size: 10.5px; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
  .line2 { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 1px; font-size: 12px; }
  .line2 .subj { color: var(--fg2); }
  .line2 .snip { color: var(--dim); }

  /* états (chargement, vide, non connecté, erreur) */
  .state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 100%; color: var(--muted); text-align: center; padding: 30px; }
  .state .halo { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 8px;
    background: color-mix(in srgb, var(--c1) 10%, transparent); color: var(--c1); }
  .state svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .state .big { font-weight: 600; font-size: 13.5px; color: var(--fg); }
  .state .sub { font-size: 12px; line-height: 1.5; }
  .state button { margin-top: 12px; padding: 9px 16px; border: 0; border-radius: 10px; background: var(--grad); color: #fff; font-weight: 600; cursor: pointer; }
  .loader { width: 24px; height: 24px; border: 2.5px solid var(--line-strong); border-top-color: var(--c1); border-radius: 50%; animation: spin .8s linear infinite; }

  /* pied : action claire, pas un simple texte */
  #foot { flex: none; display: flex; align-items: center; justify-content: center; gap: 7px; margin: 0 8px 8px; padding: 9px; border-radius: 10px;
    border-top: 0; background: var(--field); color: var(--fg2); font-size: 12px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
  #foot:hover { background: var(--hover); color: var(--fg); }
  #foot svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #foot.hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="head">
    <img id="ico" alt="">
    <span id="name">Aperçu</span>
    <span id="count" class="hidden"></span>
    <span id="spacer"></span>
    <button id="refresh" class="hbtn" title="Rafraîchir"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    <button id="open" class="hbtn" title="Ouvrir en grand"><svg viewBox="0 0 24 24"><path d="M9 5H5v4M5 5l6 6M15 19h4v-4M19 19l-6-6"/></svg></button>
  </div>
  <div id="widget"></div>
  <div id="foot"><span>Tout voir dans Gmail</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const widget = $('widget'), nameEl = $('name'), icoEl = $('ico'), countEl = $('count'), refreshBtn = $('refresh');

  // avatars teintés : fond à ~14 %, lettre dans la couleur (plus doux que les pastilles saturées)
  const AV = ['#7385ff','#9a86ff','#5aa0f2','#38bda8','#e0a53a','#e07a8b','#7c8cff','#5fbf88'];
  const avatarColor = (s) => AV[[...(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length];
  function relTime(iso) {
    const t = Date.parse(iso); if (isNaN(t)) return '';
    const m = Math.round((Date.now()-t)/60000);
    if (m < 1) return "à l'instant"; if (m < 60) return m+' min';
    const h = Math.round(m/60); if (h < 24) return h+' h';
    const d = Math.round(h/24); return d===1?'hier':d+' j';
  }
  const esc = (s) => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  peek.onLoad((d) => {
    nameEl.textContent = d.name || 'Gmail';
    if (d.icon) { icoEl.src = d.icon; icoEl.style.display = ''; } else icoEl.style.display = 'none';
    loadGmail();
  });

  async function loadGmail() {
    refreshBtn.classList.add('spin');
    widget.innerHTML = '<div class="state"><div class="loader"></div></div>';
    let r; try { r = await peek.gmailFeed(); } catch { r = { error: true }; }
    refreshBtn.classList.remove('spin');
    if (!r || r.error) { widget.innerHTML = state('cloud-off', 'Impossible de récupérer les mails', 'Réessaie dans un moment.'); countEl.classList.add('hidden'); return; }
    if (!r.authed) {
      widget.innerHTML = state('lock', 'Connecte-toi à Gmail', 'Ouvre Gmail une fois pour activer l’aperçu.', 'Ouvrir Gmail');
      countEl.classList.add('hidden');
      const b = widget.querySelector('button'); if (b) b.onclick = () => peek.openFull();
      return;
    }
    if (r.count) { countEl.textContent = r.count + ' non lu' + (r.count > 1 ? 's' : ''); countEl.classList.remove('hidden'); } else countEl.classList.add('hidden');
    if (!r.messages.length) { widget.innerHTML = state('check', 'Aucun nouveau mail', 'Boîte de réception à jour.'); return; }
    widget.innerHTML = r.messages.map((m) => {
      const c = avatarColor(m.from);
      const snip = m.summary ? ' — <span class="snip">' + esc(m.summary) + '</span>' : '';
      return `
      <div class="mail" data-link="${esc(m.link)}">
        <div class="avatar" style="background:${c}24;color:${c}">${esc((m.from.trim()[0]||'?').toUpperCase())}</div>
        <div class="mbody">
          <div class="mtop"><span class="from">${esc(m.from)}</span><span class="time">${relTime(m.date)}</span></div>
          <div class="line2"><span class="subj">${esc(m.subject)}</span>${snip}</div>
        </div>
      </div>`;
    }).join('');
    widget.querySelectorAll('.mail').forEach((el) => { el.onclick = () => peek.openMail(el.dataset.link); });
  }
  function state(icon, big, sub, btn) {
    const icons = {
      check: '<path d="M20 6L9 17l-5-5"/>',
      lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
      'cloud-off': '<path d="M3 3l18 18"/><path d="M8 8a5 5 0 0 0 .5 9H18a4 4 0 0 0 1.5-7.7"/>',
    };
    return `<div class="state"><div class="halo"><svg viewBox="0 0 24 24">${icons[icon]||icons.check}</svg></div><div class="big">${big}</div><div class="sub">${sub||''}</div>${btn?`<button>${btn}</button>`:''}</div>`;
  }

  $('open').onclick = () => peek.openFull();
  refreshBtn.onclick = () => loadGmail();
  $('foot').onclick = () => peek.openFull();
  document.addEventListener('mouseenter', () => peek.hover(true), true);
  document.body.addEventListener('mouseleave', () => peek.hover(false));
  window.addEventListener('mouseover', () => peek.hover(true));
</script>
</body>
</html>
