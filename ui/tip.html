<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tooltip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg: #171a21; --fg: #eef1f6; --line: rgba(255,255,255,.12); --shadow: 0 8px 22px rgba(0,0,0,.5); }
  body.light { --bg: #12151c; --fg: #f6f7f9; --line: rgba(255,255,255,.14); --shadow: 0 8px 22px rgba(15,23,42,.3); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #tip { position: fixed; z-index: 10; max-width: 300px; padding: 5px 9px; border-radius: 7px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); box-shadow: var(--shadow);
    font: 500 11.5px Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    white-space: pre; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
    opacity: 0; transform: translateY(2px); transition: opacity .1s ease, transform .1s ease; }
  #tip.show { opacity: 1; transform: none; }
  #tip .sub { display: block; opacity: .6; font-weight: 400; font-size: 10.5px; }
</style>
</head>
<body>
<div id="tip"></div>
<script>
  const tip = document.getElementById('tip');
  tipapi.onHide(() => tip.classList.remove('show'));
  tipapi.onShow((d) => {
    document.body.classList.toggle('light', !d.dark);
    // texte : 1re ligne principale, lignes suivantes en sous-texte
    const lines = String(d.text || '').split('\n');
    tip.innerHTML = '';
    tip.appendChild(document.createTextNode(lines[0]));
    for (let i = 1; i < lines.length; i++) { const s = document.createElement('span'); s.className = 'sub'; s.textContent = lines[i]; tip.appendChild(s); }
    tip.style.whiteSpace = lines.length > 1 ? 'normal' : 'pre';
    // mesurer puis positionner
    tip.style.left = '-9999px'; tip.style.top = '0'; tip.classList.add('show');
    const t = tip.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight, m = 6, r = d.rect;
    let x, y;
    if (d.side === 'right') { x = r.right + 8; y = r.top + (r.bottom - r.top) / 2 - t.height / 2; }
    else { x = r.left + (r.right - r.left) / 2 - t.width / 2; y = r.bottom + 7; }
    if (d.side !== 'right' && y + t.height > vh - m) y = r.top - t.height - 7; // sinon au-dessus
    x = Math.max(m, Math.min(x, vw - t.width - m));
    y = Math.max(m, Math.min(y, vh - t.height - m));
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
</script>
</body>
</html>
