<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tooltip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg: #171a21; --fg: #eef1f6; --line: rgba(255,255,255,.12); --shadow: 0 8px 22px rgba(0,0,0,.5);
    --panel: rgba(21,24,31,.97); --line-strong: rgba(255,255,255,.13); --field: rgba(255,255,255,.05);
    --c1: #7385ff; --c3: #f26d7d; --grad: linear-gradient(135deg,#6f81ff,#9a86ff); --ease: cubic-bezier(.2,.8,.2,1);
    --tfg: #eef1f6; /* texte des notifications : suit le thème, contrairement à --fg (bulle d'infobulle toujours sombre) */ }
  body.light { --bg: #12151c; --fg: #f6f7f9; --line: rgba(255,255,255,.14); --shadow: 0 8px 22px rgba(15,23,42,.3);
    --panel: rgba(255,255,255,.98); --line-strong: rgba(15,23,42,.15); --field: rgba(15,23,42,.05);
    --c1: #4d55e0; --c3: #e05561; --grad: linear-gradient(135deg,#4d55e0,#7c5cf0); --tfg: #12151c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #tip { position: fixed; z-index: 10; max-width: 300px; padding: 5px 9px; border-radius: 7px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); box-shadow: var(--shadow);
    font: 500 11.5px Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    white-space: pre; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
    opacity: 0; transform: translateY(2px); transition: opacity .1s ease, transform .1s ease; }
  #tip.show { opacity: 1; transform: none; }
  #tip .sub { display: block; opacity: .6; font-weight: 400; font-size: 10.5px; }
  /* adresse du lien survolé, collée en bas à gauche de la page (comme la bulle d'état de Chrome) */
  #status { position: fixed; z-index: 5; padding: 3px 9px; border-radius: 0 7px 0 0;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-left: 0; border-bottom: 0;
    font: 400 11.5px Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
    opacity: 0; transition: opacity .12s ease; }
  #status.show { opacity: 1; }

  /* notifications de téléchargement : au-dessus de la page web (overlay toujours au-dessus), empilées bas-centre */
  #dl-toasts { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; gap: 10px; }
  .dl-toast { width: 320px; display: flex; align-items: center; gap: 13px;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; padding: 12px 16px 12px 12px;
    color: var(--tfg); font: 13px Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.04) inset; backdrop-filter: blur(24px) saturate(1.15);
    animation: dl-toastin 340ms cubic-bezier(.3,1.4,.4,1) both; cursor: pointer; transition: background .18s var(--ease), transform .18s var(--ease); }
  .dl-toast:hover { background: color-mix(in srgb, var(--panel) 92%, var(--c1)); transform: translateY(-1px); }
  .dl-toast:active { transform: scale(.985); }
  @keyframes dl-toastin { from { opacity: 0; transform: translateY(18px) scale(.94); } to { opacity: 1; transform: none; } }
  .dl-toast.leaving { animation: dl-toastout 220ms var(--ease) both; }
  @keyframes dl-toastout { to { opacity: 0; transform: translateY(6px) scale(.98); } }
  /* icône dans un halo teinté ; terminé = halo en dégradé accent + coche blanche (comme la pastille de non-lus) */
  .dl-toast-ic { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c1) 12%, transparent); color: var(--c1); transition: background .25s var(--ease), color .25s var(--ease); }
  .dl-toast-ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .dl-toast.done .dl-toast-ic { background: var(--grad); color: #fff; }
  .dl-toast.error .dl-toast-ic { background: color-mix(in srgb, var(--c3) 12%, transparent); color: var(--c3); }
  .dl-toast-mid { flex: 1; min-width: 0; }
  .dl-toast-name { font-weight: 600; font-size: 13.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dl-toast-sub { color: var(--tfg); opacity: .62; font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .dl-bar { height: 4px; border-radius: 3px; background: var(--field); overflow: hidden; margin: 6px 0 2px; position: relative; }
  .dl-fill { height: 100%; border-radius: 3px; background: var(--grad); transition: width .2s var(--ease); }
  .dl-fill.indet { position: absolute; width: 40%; animation: dl-slide 1.1s var(--ease) infinite; }
  @keyframes dl-slide { from { left: -40% } to { left: 100% } }
</style>
<script src="locales/languages.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<div id="tip"></div>
<div id="status"></div>
<div id="dl-toasts"></div>
<script>
  const tip = document.getElementById('tip');
  const status = document.getElementById('status');

  // ---- notifications de téléchargement (au-dessus de la page, le panneau Téléchargements n'a pas besoin d'être ouvert) ----
  const DL_ICON = {
    download: '<path d="M12 4v11M7 11l5 4 5-4M5 19h14"/>',
    check: '<path d="M5 12l4 4 10-10"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
  };
  const svg = (name) => `<svg viewBox="0 0 24 24">${DL_ICON[name]}</svg>`;
  function fmtBytes(n) { const u = [tr('o'), tr('Ko'), tr('Mo'), tr('Go')]; if (!n) return '0 ' + u[0]; const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024))); return (n / Math.pow(1024, i)).toLocaleString(I18N.locale, { minimumFractionDigits: i ? 1 : 0, maximumFractionDigits: i ? 1 : 0 }) + ' ' + u[i]; }
  const dlToastsBox = document.getElementById('dl-toasts');
  // Une notification au démarrage (quelques secondes), une autre à la fin ; entre les deux, la progression
  // se lit sur l'anneau de l'icône Téléchargements (sidebar), pas ici.
  const SHOW_START = 4000, SHOW_END = 5000;
  const dlToasts = new Map(); // id -> { el|null, icEl, fillEl, subEl, timer, announced }
  function buildToast(d) {
    const row = document.createElement('div'); row.className = 'dl-toast';
    row.innerHTML = `<div class="dl-toast-ic">${svg('download')}</div>
      <div class="dl-toast-mid">
        <div class="dl-toast-name"></div>
        <div class="dl-bar"><div class="dl-fill"></div></div>
        <div class="dl-toast-sub"></div>
      </div>`;
    row.querySelector('.dl-toast-name').textContent = d.filename;
    dlToastsBox.appendChild(row);
    return { el: row, icEl: row.querySelector('.dl-toast-ic'), fillEl: row.querySelector('.dl-fill'), subEl: row.querySelector('.dl-toast-sub') };
  }
  // la fenêtre overlay est click-through ; elle ne capte la souris qu'au survol d'une notification
  function syncMouse() {
    if (!dlToastsBox.childElementCount) tipapi.mouse('off');
    else tipapi.mouse(dlToastsBox.querySelector('.dl-toast:hover') ? 'on' : 'forward');
  }
  function dismissToast(t, forget, id) {
    const el = t.el; if (!el) return;
    t.el = null;
    el.classList.add('leaving');
    setTimeout(() => { el.remove(); if (forget) dlToasts.delete(id); syncMouse(); }, 220);
  }
  function updateDownloadToast(d) {
    const active = d.state === 'progressing' || d.state === 'paused';
    let t = dlToasts.get(d.id);
    if (!t) {
      if (!active) return; // déjà terminé quand on le découvre : rien à annoncer
      t = { el: null, timer: null, announced: false }; dlToasts.set(d.id, t);
    }
    if (active && t.announced && !t.el) return; // démarrage déjà signalé, notification repliée : l'icône prend le relais
    if (!t.el) {
      Object.assign(t, buildToast(d)); t.announced = true;
      t.el.onmouseenter = () => tipapi.mouse('on');
      t.el.onmouseleave = () => tipapi.mouse('forward');
      syncMouse();
    }
    t.el.onclick = () => { tipapi.openDownloads(); dismissToast(t, !active, d.id); }; // ouvre le panneau Téléchargements
    clearTimeout(t.timer);
    if (active) {
      if (d.total) { t.fillEl.classList.remove('indet'); t.fillEl.style.width = Math.round(100 * d.received / d.total) + '%'; t.subEl.textContent = `${fmtBytes(d.received)} / ${fmtBytes(d.total)}`; }
      else { t.fillEl.classList.add('indet'); t.fillEl.style.width = ''; t.subEl.textContent = fmtBytes(d.received); }
      t.timer = setTimeout(() => dismissToast(t, false, d.id), SHOW_START);
    } else {
      const ok = d.state === 'completed';
      t.el.classList.toggle('done', ok); t.el.classList.toggle('error', !ok);
      t.icEl.innerHTML = svg(ok ? 'check' : 'close');
      t.fillEl.classList.remove('indet'); t.fillEl.style.width = '100%';
      t.subEl.textContent = ok ? tr('Terminé') : (d.state === 'cancelled' ? tr('Annulé') : tr('Échec'));
      t.timer = setTimeout(() => dismissToast(t, true, d.id), SHOW_END);
    }
  }
  tipapi.onDownloads((d) => { document.body.classList.toggle('light', !d.dark); (d.list || []).forEach(updateDownloadToast); });

  // d = { text, bounds: rectangle de la page dans la fenêtre, dark } ou null pour masquer
  tipapi.onLinkStatus((d) => {
    if (!d || !d.text) { status.classList.remove('show'); return; }
    document.body.classList.toggle('light', !d.dark);
    const b = d.bounds;
    status.textContent = d.text;
    status.style.left = b.x + 'px';
    status.style.bottom = Math.max(0, window.innerHeight - (b.y + b.height)) + 'px';
    status.style.maxWidth = Math.max(120, Math.round(b.width * 0.6)) + 'px';
    status.classList.add('show');
  });
  tipapi.onHide(() => tip.classList.remove('show'));
  tipapi.onShow((d) => {
    document.body.classList.toggle('light', !d.dark);
    // texte : 1re ligne principale, lignes suivantes en sous-texte
    const lines = String(d.text || '').split('\n');
    tip.innerHTML = '';
    tip.appendChild(document.createTextNode(lines[0]));
    for (let i = 1; i < lines.length; i++) { const s = document.createElement('span'); s.className = 'sub'; s.textContent = lines[i]; tip.appendChild(s); }
    tip.style.whiteSpace = lines.length > 1 ? 'normal' : 'pre';
    // mesurer puis positionner
    tip.style.left = '-9999px'; tip.style.top = '0'; tip.classList.add('show');
    const t = tip.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight, m = 6, r = d.rect;
    let x, y;
    if (d.side === 'right') { x = r.right + 8; y = r.top + (r.bottom - r.top) / 2 - t.height / 2; }
    else { x = r.left + (r.right - r.left) / 2 - t.width / 2; y = r.bottom + 7; }
    if (d.side !== 'right' && y + t.height > vh - m) y = r.top - t.height - 7; // sinon au-dessus
    x = Math.max(m, Math.min(x, vw - t.width - m));
    y = Math.max(m, Math.min(y, vh - t.height - m));
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
</script>
</body>
</html>
