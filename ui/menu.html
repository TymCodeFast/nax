<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --panel: #171a21; --fg: #eef1f6; --muted: #8b93a3; --dim: #626a78;
    --line: rgba(255,255,255,.09); --hover: rgba(255,255,255,.08); --danger: #f26d7d;
    --c1: #7385ff; --c2: #9a86ff; --shadow: 0 18px 44px rgba(0,0,0,.55);
  }
  body.light {
    --panel: #ffffff; --fg: #12151c; --muted: #616a79; --dim: #98a0ae;
    --line: rgba(15,23,42,.09); --hover: rgba(15,23,42,.05); --danger: #e05561; --shadow: 0 18px 44px rgba(15,23,42,.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  #menu { position: absolute; min-width: 210px; max-width: 320px; padding: 6px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--fg);
    opacity: 0; transform: scale(.97); transform-origin: top left; }
  #menu.pop { animation: pop .13s cubic-bezier(.2,.8,.2,1) forwards; }
  #menu.closing { animation: pop .11s cubic-bezier(.2,.8,.2,1) reverse forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
  .item { display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px;
    font-size: 13px; font-weight: 450; color: var(--fg); white-space: nowrap; cursor: default; gap: 10px; }
  .item:hover, .item.sel { background: var(--hover); }
  .item.sel { box-shadow: inset 0 0 0 1px var(--line); }
  .item.danger { color: var(--danger); }
  .item.disabled { color: var(--dim); pointer-events: none; }
  .item .lbl { flex: 1; }
  /* raccourci clavier, à droite : discret, pour que le menu serve aussi d'aide-mémoire */
  .item .hint { margin-left: 18px; font-size: 11.5px; font-weight: 450; color: var(--muted); letter-spacing: .01em; }
  .sep { height: 1px; margin: 5px 8px; background: var(--line); }
</style>
</head>
<body>
<div id="menu"></div>
<script>
  const menuEl = document.getElementById('menu');
  let items = [], sel = -1;
  let armed = false;                         // n'autorise qu'un seul jeu d'animation par ouverture
  let closing = false;

  ctxmenu.onShow((d) => {
    document.body.classList.toggle('light', !d.dark);
    items = d.items || []; sel = -1;
    menuEl.classList.remove('pop', 'closing'); closing = false; // repart de l'état fermé
    // force un reflow pour que le retrait de .pop soit pris en compte avant le prochain ajout
    void menuEl.offsetWidth;
    armed = true;
    menuEl.innerHTML = '';
    items.forEach((it) => {
      if (it.sep) { const s = document.createElement('div'); s.className = 'sep'; menuEl.appendChild(s); return; }
      const row = document.createElement('div');
      row.className = 'item' + (it.danger ? ' danger' : '') + (it.enabled ? '' : ' disabled');
      const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = it.label; row.appendChild(lbl);
      if (it.hint) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = it.hint; row.appendChild(h); }
      row.dataset.idx = it.idx;
      if (it.enabled) {
        row.onmouseenter = () => setSel([...menuEl.querySelectorAll('.item')].indexOf(row));
        row.onclick = () => ctxmenu.select(it.idx);
      }
      menuEl.appendChild(row);
    });
    // positionnement avec débordement géré (mesuré avant affichage)
    const vw = window.innerWidth, vh = window.innerHeight;
    const r = menuEl.getBoundingClientRect();
    let x = d.x, y = d.y;
    if (x + r.width > vw - 8) x = Math.max(8, vw - r.width - 8);
    if (y + r.height > vh - 8) y = Math.max(8, vh - r.height - 8);
    menuEl.style.left = x + 'px';
    menuEl.style.top = y + 'px';
    // prêt : le contenu est posé et positionné, on peut afficher la fenêtre.
    // (appel synchrone : rAF est gelé tant que la fenêtre est cachée)
    ctxmenu.ready();
  });
  // la fenêtre est maintenant visible → on joue l'animation une seule fois.
  // Le garde `armed` ignore tout rejeu de 'menu-play' (cascade de focus après un survol du rail).
  ctxmenu.onPlay(() => { if (!armed) return; armed = false; requestAnimationFrame(() => menuEl.classList.add('pop')); });

  // joue la sortie avant de prévenir le process principal (symétrique de l'entrée armed/ready/play)
  function requestClose() {
    if (closing) return;
    closing = true;
    menuEl.classList.add('closing');
    setTimeout(() => ctxmenu.close(), 110);
  }

  const rows = () => [...menuEl.querySelectorAll('.item:not(.disabled)')];
  function setSel(i) {
    const list = [...menuEl.querySelectorAll('.item')];
    list.forEach((r) => r.classList.remove('sel'));
    sel = i; if (list[i]) list[i].classList.add('sel');
  }
  function move(dir) {
    const list = [...menuEl.querySelectorAll('.item')];
    let i = sel;
    for (let k = 0; k < list.length; k++) {
      i = (i + dir + list.length) % list.length;
      if (!list[i].classList.contains('disabled')) { setSel(i); break; }
    }
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') requestClose();
    else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { const list = [...menuEl.querySelectorAll('.item')]; if (list[sel] && list[sel].dataset.idx) ctxmenu.select(+list[sel].dataset.idx); }
  });
  // clic en dehors du menu → fermer
  document.body.addEventListener('mousedown', (e) => { if (!menuEl.contains(e.target)) requestClose(); });
  window.addEventListener('blur', () => requestClose());
  document.body.addEventListener('contextmenu', (e) => { e.preventDefault(); requestClose(); });
</script>
</body>
</html>
