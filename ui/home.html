<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil</title>
<style>
  /* mêmes tokens que l'interface de NaX (ui/style.css) */
  :root { --bg: #0c0e13; --fg: #eef1f6; --muted: #8b93a3; --dim: #626a78;
    --field: rgba(255, 255, 255, .04); --field-hover: rgba(255, 255, 255, .065);
    --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .16);
    --c1: #7385ff; --glow: 0 0 0 3px rgba(115, 133, 255, .22);
    --mesh: rgba(115, 133, 255, .14); --shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f6f9; --fg: #161a23; --muted: #5f6878; --dim: #8a92a2;
    --field: #ffffff; --field-hover: #ffffff; --line: rgba(15, 23, 42, .12); --line-strong: rgba(15, 23, 42, .22);
    --glow: 0 0 0 3px rgba(115, 133, 255, .28); --mesh: rgba(115, 133, 255, .10); --shadow: 0 10px 30px rgba(15, 23, 42, .10); } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: radial-gradient(900px 520px at 50% -12%, var(--mesh), transparent 70%), var(--bg);
    color: var(--fg); font: 400 14px Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .brand { width: 64px; height: 64px; border-radius: 18px; box-shadow: var(--shadow); }
  form { width: min(620px, 90vw); margin: 0; }
  .search { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 18px; border-radius: 14px;
    background: var(--field); border: 1px solid var(--line-strong); box-shadow: var(--shadow); transition: border-color .16s, box-shadow .16s, background .16s; }
  .search:hover { background: var(--field-hover); }
  .search:focus-within { border-color: var(--c1); box-shadow: var(--glow), var(--shadow); }
  .search svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--fg);
    font: 400 16px Inter, system-ui, "Segoe UI", sans-serif; }
  .search input::placeholder { color: var(--dim); }
</style>
</head>
<body>
<img class="brand" src="../assets/icon.png" alt="NaX">
<form action="nax-home://search" method="get" role="search">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" name="q" placeholder="Rechercher ou saisir une adresse" aria-label="Rechercher ou saisir une adresse" autocomplete="off" spellcheck="false" autofocus>
  </label>
</form>
</body>
</html>
